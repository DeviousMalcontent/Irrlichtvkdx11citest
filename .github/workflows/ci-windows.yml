name: CI - Windows

permissions:
  contents: write

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install -y ninja --no-progress

      - name: Install vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            if (-not (Test-Path 'C:\vcpkg')) {
              git clone 'https://github.com/microsoft/vcpkg.git' 'C:\vcpkg'
            } else {
              Write-Host 'C:\vcpkg already exists — updating'
              Push-Location 'C:\vcpkg'
              git fetch --all
              git reset --hard origin/master
              Pop-Location
            }

            & 'C:\vcpkg\bootstrap-vcpkg.bat'
            # Only keep the shader compiler tools here; SDL2 and Vulkan are vendored in the repo.
            & 'C:\vcpkg\vcpkg.exe' install glslang:x64-windows shaderc:x64-windows spirv-tools:x64-windows vulkan-headers:x64-windows
            & 'C:\vcpkg\vcpkg.exe' integrate install
          } catch {
            Write-Error "vcpkg install step failed: $($_.Exception.Message)"
            throw
          }

      - name: Fetch and install SDL2 2.0.8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdlPrefix = 'C:\SDL\release-2.0.8'
          if (-not (Test-Path $sdlPrefix)) {
            git clone --depth 1 --branch release-2.0.8 https://github.com/libsdl-org/SDL.git $sdlPrefix
          } else {
            Write-Host "$sdlPrefix already exists — skipping clone"
          }
          
          Push-Location $sdlPrefix
          if (-not (Test-Path 'build')) { md build | Out-Null }
          
          # 1. Generate the Visual Studio project files via CMake
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSDL_SHARED=ON -DCMAKE_INSTALL_PREFIX="${sdlPrefix}\install"
          
          # 2. Inject vcruntime.lib into AdditionalDependencies inside the .vcxproj using PowerShell
          $vcxprojPath = "build\SDL2.vcxproj"
          if (Test-Path $vcxprojPath) {
              Write-Host "Patching $vcxprojPath to append vcruntime.lib..."
              (Get-Content $vcxprojPath) -replace '<AdditionalDependencies>', '<AdditionalDependencies>vcruntime.lib;' | Set-Content $vcxprojPath
          } else {
              Write-Error "Could not find $vcxprojPath to patch!"
          }
          
          # 3. Build and install now that the dependencies are patched
          Push-Location $sdlPrefix
          if (-not (Test-Path 'build')) { md build | Out-Null }
          cmake --build build --config Release --target INSTALL
          Pop-Location

