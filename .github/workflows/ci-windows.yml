name: CI - Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install vcpkg
        shell: powershell
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          .\C:\vcpkg\bootstrap-vcpkg.bat
          .\C:\vcpkg\vcpkg.exe install sdl2:x64-windows vulkan-headers:x64-windows vulkan-loader:x64-windows

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.26.0'

      - name: Configure with CMake
        shell: powershell
        run: |
          mkdir build
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DIRR_BUILD_RENDERSYSTEM_GL=1 `
            -DIRR_BUILD_RENDERSYSTEM_Vulkan=1 `
            -DBUILD_USE_SDL2=ON

      - name: Build
        shell: powershell
        run: cmake --build build --config Release --parallel

      - name: Run CTest if available
        shell: powershell
        run: |
          if (Test-Path "build/CTestTestfile.cmake") {
            ctest --test-dir build --output-on-failure -C Release --parallel 2
          } else {
            Write-Host "No CTest configuration found."
          }
