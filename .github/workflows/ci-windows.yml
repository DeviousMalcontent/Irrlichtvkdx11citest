name: CI - Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install vcpkg
        shell: powershell
        run: |
          # Clone vcpkg only if missing; otherwise update it to be idempotent
          if (-not (Test-Path 'C:\vcpkg')) {
            git clone https://github.com/microsoft/vcpkg.git 'C:\vcpkg'
          } else {
            Write-Host 'C:\vcpkg already exists — updating'
            Push-Location 'C:\vcpkg'
            git fetch --all
            git reset --hard origin/master
            Pop-Location
          }

          # Execute using call operator (&) — do NOT prefix absolute paths with .\
          & 'C:\vcpkg\bootstrap-vcpkg.bat'
          & 'C:\vcpkg\vcpkg.exe' install sdl2:x64-windows vulkan-headers:x64-windows vulkan-loader:x64-windows

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.26.0'

      - name: Install Ninja
        shell: powershell
        run: choco install -y ninja --no-progress

      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify build tools
        shell: powershell
        run: |
          Write-Host "Checking Ninja and MSVC (cl.exe) availability..."
          where.exe ninja
          where.exe cl

      - name: Configure with CMake
        shell: powershell
        run: |
          mkdir build
          cmake -S . -B build `
            -G "Ninja" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DIRR_BUILD_RENDERSYSTEM_GL=1 `
            -DIRR_BUILD_RENDERSYSTEM_Vulkan=1 `
            -DBUILD_USE_SDL2=ON

      - name: Build
        shell: powershell
        run: cmake --build build --config Release --parallel

      - name: Run CTest if available
        shell: powershell
        run: |
          if (Test-Path "build/CTestTestfile.cmake") {
            ctest --test-dir build --output-on-failure -C Release --parallel 2
          } else {
            Write-Host "No CTest configuration found."
          }
