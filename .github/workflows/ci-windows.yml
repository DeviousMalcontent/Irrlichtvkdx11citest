name: CI - Windows

permissions:
  contents: write

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install -y ninja --no-progress

      - name: Install vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            if (-not (Test-Path 'C:\vcpkg')) {
              git clone 'https://github.com/microsoft/vcpkg.git' 'C:\vcpkg'
            } else {
              Write-Host 'C:\vcpkg already exists — updating'
              Push-Location 'C:\vcpkg'
              git fetch --all
              git reset --hard origin/master
              Pop-Location
            }

            & 'C:\vcpkg\bootstrap-vcpkg.bat'
            & 'C:\vcpkg\vcpkg.exe' install sdl2:x64-windows@2.0.8 vulkan-headers:x64-windows@1.2.157 vulkan-loader:x64-windows@1.3.268.0 vulkan-sdk-components:x64-windows
            & 'C:\vcpkg\vcpkg.exe' install glslang:x64-windows shaderc:x64-windows spirv-tools:x64-windows
            & 'C:\vcpkg\vcpkg.exe' integrate install
          } catch {
            Write-Error "vcpkg install step failed: $($_.Exception.Message)"
            throw
          }

      - name: Install Vulkan-Hpp (Khronos)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            if (-not (Test-Path 'C:\vulkan-hpp')) {
              git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Hpp.git C:\vulkan-hpp
            } else {
              Write-Host 'C:\vulkan-hpp already exists — updating'
              Push-Location 'C:\vulkan-hpp'
              git fetch --all
              git reset --hard origin/master
              Pop-Location
            }
          } catch {
            Write-Error "Vulkan-Hpp install/update step failed: $($_.Exception.Message)"
            throw
          }

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.26.0'

      - name: Verify build tools
        shell: cmd
        run: |
          where ninja
          where cl
          where cmake

      - name: Configure with CMake
        shell: cmd
        continue-on-error: true
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" x64
          mkdir build
          cmake -S . -B build ^
            -G "Visual Studio 17 2022" ^
            -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL ^
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
            -DCMAKE_INCLUDE_PATH="C:/vulkan-hpp/include" ^
            -DIRR_BUILD_RENDERSYSTEM_GL=1 ^
            -DIRR_BUILD_RENDERSYSTEM_Vulkan=1 ^
            -DBUILD_USE_SDL2=ON ^
            -DBUILD_EXAMPLES=ON

      - name: Build
        shell: cmd
        continue-on-error: true
        run: cmake --build build --config Release --parallel

      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build\**\*.dll
            build\**\*.exe
            build\bin\Release\**\*
            lib\Win64-VisualStudio\Irrlicht.lib
            build\**\*.vcxproj
            build\**\*.lib

  release-upload:
    name: Create Release & Upload bin
    runs-on: windows-2022
    needs: [ build ]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: artifacts

      - name: Collect build outputs
        shell: pwsh
        if: ${{ always() }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = "artifacts"
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dest | Out-Null

          # If download-artifact provided files, they'll be under artifacts already; otherwise try to copy common locations
          if (Test-Path 'artifacts') {
            Write-Host "Artifacts folder exists — listing contents"
            Get-ChildItem -Recurse artifacts -File | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "No downloaded artifacts — attempting to copy from build folder"
            Copy-Item -Path "build\bin\Release\**\*" -Destination $dest -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item -Path "lib\Win64-VisualStudio\Irrlicht.lib" -Destination $dest -Force -ErrorAction SilentlyContinue
          }

          $items = Get-ChildItem -Recurse $dest -File -ErrorAction SilentlyContinue
          if ($null -ne $items -and $items.Count -gt 0) {
            $items | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "No files were copied to $dest"
          }

      - name: Zip artifacts
        shell: pwsh
        if: ${{ always() }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = "artifacts"
          $zipPath = "artifacts.zip"
          $files = Get-ChildItem -Path $artifactDir -Recurse -File -ErrorAction SilentlyContinue
          if ($null -ne $files -and $files.Count -gt 0) {
            Write-Host "Compressing $($files.Count) artifact file(s) into $zipPath"
            Compress-Archive -Path "$artifactDir\*" -DestinationPath $zipPath -Force
          } else {
            Write-Host "No artifact files found — creating placeholder and zipping"
            New-Item -ItemType File -Path (Join-Path $artifactDir 'placeholder.txt') -Value "No artifacts were found in this build." -Force | Out-Null
            Compress-Archive -Path "$artifactDir\*" -DestinationPath $zipPath -Force
          }

      - name: Create release and upload artifacts
        if: ${{ always() }}
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          name: "CI build ${{ github.run_number }}"
          body: "Automated build artifacts (partial build allowed)."
          artifacts: artifacts.zip
          artifactContentType: zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit artifacts to branch
        if: ${{ always() }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetBranch = 'ci-builds'
          try { git fetch origin $targetBranch } catch { Write-Host 'Fetch failed; target branch may not exist yet' }
          $exists = (git ls-remote --heads origin $targetBranch)
          if ($exists) {
            git checkout -B $targetBranch origin/$targetBranch
          } else {
            git checkout -B $targetBranch
          }

          $destDir = "ci_builds/build-${{ github.run_number }}"
          if (Test-Path $destDir) { Remove-Item -Recurse -Force $destDir }
          New-Item -ItemType Directory -Path $destDir | Out-Null
          if (Test-Path 'artifacts') {
            Copy-Item -Path "artifacts\*" -Destination $destDir -Recurse -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "No artifacts directory found to commit"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_builds || true
          $staged = git diff --staged --name-only
          if ($staged) {
            git commit -m "CI: update build outputs for ${{ github.run_number }} (${{ github.sha }})"
            git push --set-upstream origin HEAD:$targetBranch
          } else {
            Write-Host "No changes to commit"
          }

      - name: Run CTest if available
        shell: cmd
        continue-on-error: true
        run: |
          if exist build\CTestTestfile.cmake (
            ctest --test-dir build --output-on-failure -C Release --parallel 2
          ) else (
            echo No CTest configuration found.
          )
