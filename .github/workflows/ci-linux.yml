name: CI - Linux

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils-dev \
            cmake \
            ninja-build \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            zlib1g-dev \
            libpng-dev \
            libjpeg-dev \
            libfreetype6-dev \
            libsdl2-dev \
            libvulkan-dev \
            mesa-vulkan-drivers

      - name: Configure with CMake
        run: |
          cmake -S . -B $BUILD_DIR \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DIRR_BUILD_RENDERSYSTEM_GL=1 \
            -DIRR_BUILD_RENDERSYSTEM_Vulkan=1 \
            -DBUILD_USE_SDL2=ON

      - name: Build
        run: cmake --build $BUILD_DIR --parallel

      - name: Run CTest if available
        if: ${{ always() }}
        run: |
          if [ -f "$BUILD_DIR/CTestTestfile.cmake" ]; then
            ctest --test-dir "$BUILD_DIR" --output-on-failure --parallel 2 || true
          else
            echo "No CTest configuration found."
          fi
